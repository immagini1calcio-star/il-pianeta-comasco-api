
name: Aggiorna dati Il Pianeta Comasco

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiornamento-dati-comasco
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegue aggiornamento
        run: python fetch_data.py

      - name: Controlla il JSON
        run: python -m json.tool risultati.json > /dev/null

      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add risultati.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati."
          else
            git commit -m "Aggiornamento automatico dati Como"
            git push origin HEAD:main
          fi
